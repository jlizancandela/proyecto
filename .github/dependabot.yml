version: 2

updates:
  # Keeps the pinned interpreter current. When 8.4.28 (or any later patch)
  # ships, this opens a pull request; merging it triggers the publish workflow,
  # which rebuilds and redeploys the image.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(docker)"

  # Keeps the actions used by the publish workflow current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
