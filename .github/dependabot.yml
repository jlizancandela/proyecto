version: 2

updates:
  # Keeps the pinned interpreter current. When a new 8.4 patch ships, this
  # opens a pull request; merging it triggers the publish workflow, which
  # rebuilds and redeploys the image.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: daily
      time: "13:15"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(docker)"
    ignore:
      # Stay on the 8.4 branch. Each branch was patched on a different date,
      # so 8.5.11 is newer than 8.4.27 and still carries CVE-2026-109618 and
      # CVE-2026-109619. Dependabot would otherwise propose exactly that, and
      # a version check that only knows the 8.4 floor would wave it through.
      # Moving to 8.5 is a deliberate decision, not a patch bump.
      - dependency-name: "php"
        versions:
          - ">= 8.5"

  # Keeps the actions used by the publish workflow current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
