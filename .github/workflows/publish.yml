name: Publish image

# The image is rebuilt on every change that can affect it, and once a week
# regardless. The weekly run is the safety net that keeps the interpreter
# current even when Dependabot finds nothing to bump: it re-reads whatever the
# pinned tag resolves to and redeploys.
on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "docker/**"
      - "composer.json"
      - "composer.lock"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "views/**"
      - "public/**"
      - ".github/workflows/publish.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

env:
  IMAGE: jlizancandela/peluqueria:latest

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: jlizancandela
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Refuse to deploy an image that still carries a vulnerable interpreter.
      # A forgotten pin then fails loudly here instead of silently shipping.
      - name: Verify the image runs a patched interpreter
        run: |
          docker pull "$IMAGE"
          docker run --rm --entrypoint php "$IMAGE" \
            -r 'if (version_compare(PHP_VERSION, "8.4.27", "<")) { fwrite(STDERR, "Vulnerable PHP: ".PHP_VERSION."\n"); exit(1); } echo "PHP ".PHP_VERSION."\n";'

      # Production is the local server stack in ~/svr, which a hosted runner
      # cannot reach. Publishing the image is the automated half; picking it up
      # is `just deploy` from the machine that hosts the stack.
