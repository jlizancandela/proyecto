name: Publish image

# The image is rebuilt on every change that can affect it, and once a week
# regardless. The weekly run is the safety net that keeps the interpreter
# current even when Dependabot finds nothing to bump: it re-reads whatever the
# pinned tag resolves to and redeploys.
on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "docker/**"
      - "composer.json"
      - "composer.lock"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "views/**"
      - "public/**"
      - ".github/workflows/publish.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

env:
  IMAGE: jlizancandela/peluqueria:latest
  DEPLOY_HOST: 138.199.203.37

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: jlizancandela
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Refuse to deploy an image that still carries a vulnerable interpreter.
      # A forgotten pin then fails loudly here instead of silently shipping.
      - name: Verify the image runs a patched interpreter
        run: |
          docker pull "$IMAGE"
          docker run --rm --entrypoint php "$IMAGE" \
            -r 'if (version_compare(PHP_VERSION, "8.4.27", "<")) { fwrite(STDERR, "Vulnerable PHP: ".PHP_VERSION."\n"); exit(1); } echo "PHP ".PHP_VERSION."\n";'

      # Only from main, and only once the deploy key exists. Until the key is
      # provisioned the build and push still run, so the image itself is never
      # stale; the deploy step just skips.
      - name: Deploy to production
        if: github.ref == 'refs/heads/main' && env.DEPLOY_KEY != ''
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -eu
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o ConnectTimeout=15 \
              root@"$DEPLOY_HOST" \
              'just --justfile ~/proyecto/justfile --working-directory ~/proyecto deploy'
