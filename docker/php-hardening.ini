; PHP hardening for the application image.
;
; Context: php2shell (CVE-2026-109618, CVE-2026-109619) allows unauthenticated
; remote code execution on PHP before these fixes. Upgrading the interpreter to
; 8.4.27 is the actual fix; the settings below only shrink the attack surface
; and stop leaking the exact interpreter version.
;
; Loaded through /usr/local/etc/php/conf.d/, which PHP scans even when the image
; ships no php.ini.

; CVE-2026-109619 (RCE via stale global state): the session upload-progress
; mechanism is one of the confirmed consumer paths. This application never uses
; it, so disabling it removes the path entirely.
session.upload_progress.enabled = 0
session.upload_progress.cleanup = Off

; CVE-2026-109618 (RCE via OOM corruption): keep allocations bounded so a
; request reaches the limit early and predictably instead of mid-cleanup.
memory_limit = 128M
post_max_size = 8M
upload_max_filesize = 2M
max_execution_time = 30
max_input_time = 30

; Do not advertise the interpreter version to unauthenticated clients.
expose_php = Off

; Never render diagnostics to the client. The application logs through
; error_log() and renders views/errors/500.php for handled failures, so nothing
; here is used for user-facing output.
display_errors = Off
display_startup_errors = Off
log_errors = On
